<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050611">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pac-Man">
    <title>Pac-Man</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="login-screen" class="screen auth-screen">
        <div class="auth-panel">
          <h1>PAC-MAN</h1>
          <label>
            Player
            <input id="player-name" autocomplete="username" maxlength="20" placeholder="Player name">
          </label>
          <label>
            Password
            <input id="player-password" autocomplete="current-password" type="password" maxlength="40" placeholder="Password">
          </label>
          <div class="button-row">
            <button id="login-button" type="button">Log In</button>
            <button id="register-button" class="secondary" type="button">Register</button>
          </div>
          <p id="auth-message" class="message" role="status"></p>
        </div>
      </section>

      <section id="game-screen" class="screen game-screen hidden">
        <header class="topbar">
          <div class="stat"><span>Score</span><strong id="score">0</strong></div>
          <div class="stat"><span>Lives</span><strong id="lives">3</strong></div>
          <label class="difficulty">
            <span>Difficulty</span>
            <select id="difficulty">
              <option>Easy</option>
              <option selected>Medium</option>
              <option>Hard</option>
            </select>
          </label>
          <div class="topbar-actions">
            <button id="pause-button" type="button">Pause</button>
            <button id="restart-button" class="secondary" type="button">Restart</button>
            <button id="logout-button" class="secondary" type="button">Logout</button>
          </div>
        </header>

        <div class="playfield">
          <canvas id="game-canvas" width="840" height="870" aria-label="Pac-Man game board"></canvas>
          <div id="overlay" class="overlay hidden">
            <strong id="overlay-title"></strong>
            <span id="overlay-copy"></span>
          </div>
        </div>

        <nav class="touch-pad" aria-label="Touch controls">
          <button data-dir="up" type="button">▲</button>
          <button data-dir="left" type="button">◀</button>
          <button data-dir="down" type="button">▼</button>
          <button data-dir="right" type="button">▶</button>
        </nav>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
